[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Quantitative equity research toolkit: factor models, backtesting, risk, pairs trading, options."
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scipy", "statsmodels", "yfinance", "matplotlib", "requests"]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
